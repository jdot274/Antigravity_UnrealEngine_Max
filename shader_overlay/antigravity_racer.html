<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTIGRAVITY RACER — Nexus Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', 'Consolas', monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    #c { display: block; width: 100vw; height: 100vh; }

    /* ── HUD ────────────────────────────────────────── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .panel {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(0,255,120,0.2);
      border-radius: 6px;
      padding: 8px 18px;
      min-width: 90px;
    }
    .panel-label {
      font-size: 9px; letter-spacing: 3px;
      color: rgba(0,255,120,0.45); text-transform: uppercase; margin-bottom: 3px;
    }
    .panel-value {
      font-size: 24px; font-weight: bold;
      color: #00ff88; text-shadow: 0 0 14px #00ff88;
      letter-spacing: 1px;
    }
    #lives-panel .panel-value {
      font-size: 18px; letter-spacing: 4px;
      color: #ff4466; text-shadow: 0 0 10px #ff4466;
    }
    #boost-panel .panel-value {
      font-size: 14px; letter-spacing: 2px;
      color: #00aaff; text-shadow: 0 0 10px #00aaff;
    }

    /* ── VELOCITY BAR ───────────────────────────────── */
    #vel-bar-wrap {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: 280px; pointer-events: none; z-index: 10; text-align: center;
    }
    #vel-bar-label {
      font-size: 9px; letter-spacing: 3px; color: rgba(0,255,120,0.4);
      text-transform: uppercase; margin-bottom: 6px;
    }
    #vel-bar-track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden;
    }
    #vel-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #00ff88, #aaff00, #ffee00, #ff4400);
      border-radius: 2px;
      box-shadow: 0 0 10px #00ff88;
      transition: width 0.25s ease;
    }

    /* ── OVERLAY ────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 20;
      background: rgba(0,0,0,0.72);
    }
    .overlay-tag {
      font-size: 10px; letter-spacing: 6px;
      color: rgba(0,255,120,0.5); text-transform: uppercase; margin-bottom: 18px;
    }
    #overlay-title {
      font-size: 76px; font-weight: 900; letter-spacing: 8px;
      background: linear-gradient(135deg, #00ff88 0%, #aaff22 45%, #ffee00 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1; margin-bottom: 10px;
    }
    #overlay-sub {
      font-size: 13px; letter-spacing: 4px;
      color: rgba(255,255,255,0.4); margin-bottom: 48px;
    }
    .ctrl-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px 32px; margin-bottom: 44px;
      color: rgba(255,255,255,0.35); font-size: 11px; letter-spacing: 1px;
    }
    .ctrl-key {
      color: #00ff88; background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.25); border-radius: 4px;
      padding: 1px 7px; display: inline-block;
    }
    #overlay-action {
      font-size: 12px; letter-spacing: 5px;
      color: #00ff88; text-shadow: 0 0 18px #00ff88;
      text-transform: uppercase;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── DAMAGE FLASH ───────────────────────────────── */
    #dmg-flash {
      position: fixed; inset: 0;
      background: rgba(255,0,50,0.45);
      pointer-events: none; z-index: 15;
      opacity: 0; transition: opacity 0.08s ease;
    }

    /* ── BOOST RING ─────────────────────────────────── */
    #boost-ring {
      position: fixed; bottom: 60px; right: 28px;
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid rgba(0,170,255,0.3);
      pointer-events: none; z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    #boost-ring-fill {
      width: 50px; height: 50px; border-radius: 50%;
      background: conic-gradient(#00aaff 0%, rgba(0,0,0,0) 0%);
      transition: background 0.1s;
    }
    #boost-ring-label {
      position: absolute; font-size: 8px; letter-spacing: 2px;
      color: rgba(0,170,255,0.6); bottom: -16px; width: 100%; text-align: center;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="panel">
    <div class="panel-label">Score</div>
    <div class="panel-value" id="hud-score">0</div>
  </div>
  <div class="panel">
    <div class="panel-label">Speed</div>
    <div class="panel-value" id="hud-speed">0 km/h</div>
  </div>
  <div class="panel" id="lives-panel">
    <div class="panel-label">Hull</div>
    <div class="panel-value" id="hud-lives">♦♦♦</div>
  </div>
</div>

<div id="vel-bar-wrap">
  <div id="vel-bar-label">Velocity</div>
  <div id="vel-bar-track"><div id="vel-bar-fill"></div></div>
</div>

<div id="boost-ring">
  <div id="boost-ring-fill"></div>
  <div id="boost-ring-label">BOOST</div>
</div>

<div id="overlay">
  <div class="overlay-tag">Antigravity Systems Corp — NexusDrive v2.1</div>
  <div id="overlay-title">RACER</div>
  <div id="overlay-sub">Neon Highway Protocol</div>
  <div class="ctrl-grid">
    <span><span class="ctrl-key">A</span> / <span class="ctrl-key">←</span> &nbsp;Lane Left</span>
    <span><span class="ctrl-key">D</span> / <span class="ctrl-key">→</span> &nbsp;Lane Right</span>
    <span><span class="ctrl-key">SHIFT</span> &nbsp;Turbo Boost</span>
    <span><span class="ctrl-key">SWIPE</span> &nbsp;Mobile Steer</span>
  </div>
  <div id="overlay-action">Press Space or Tap to Launch</div>
</div>

<div id="dmg-flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
// ================================================================
//  ANTIGRAVITY RACER  —  Three.js Neon Highway Endless Runner
// ================================================================

// ── Renderer + Scene ────────────────────────────────────────────
const canvas  = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000008);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x000008, 90, 280);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 4.2, -13);
camera.rotation.x = 0.19;

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// ── Lighting ────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112211, 1.0));
const sunLight = new THREE.DirectionalLight(0x334422, 1.2);
sunLight.position.set(0, 12, -6);
scene.add(sunLight);

// ── Constants ───────────────────────────────────────────────────
const ROAD_W   = 12;
const TILE_Z   = 30;
const N_TILES  = 24;
const LANES    = [-4, 0, 4];          // x positions of lane centres
const DIVIDERS = [-6, -2, 2, 6];      // lane divider / edge x positions

// ── Shared Road Materials ────────────────────────────────────────
const MAT = {
  road:      new THREE.MeshLambertMaterial({ color: 0x080812 }),
  edgeLine:  new THREE.MeshBasicMaterial({ color: 0x00ff66 }),
  divLine:   new THREE.MeshBasicMaterial({ color: 0xffee00 }),
  edgeGlow:  new THREE.MeshBasicMaterial({ color: 0x00ff66,  transparent: true, opacity: 0.11, depthWrite: false }),
  divGlow:   new THREE.MeshBasicMaterial({ color: 0xffee00,  transparent: true, opacity: 0.09, depthWrite: false }),
  gridLine:  new THREE.MeshBasicMaterial({ color: 0x003322,  transparent: true, opacity: 0.45 }),
  barrier:   new THREE.MeshLambertMaterial({ color: 0x030310 }),
};

// ── Road Tile Factory ────────────────────────────────────────────
function buildTile() {
  const g = new THREE.Group();

  // Road surface
  const surf = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_W, TILE_Z).rotateX(-Math.PI / 2),
    MAT.road
  );
  surf.position.y = -0.02;
  g.add(surf);

  // Longitudinal neon lines
  DIVIDERS.forEach((x, i) => {
    const isEdge = i === 0 || i === 3;
    const mat  = isEdge ? MAT.edgeLine : MAT.divLine;
    const gMat = isEdge ? MAT.edgeGlow : MAT.divGlow;
    const w    = isEdge ? 0.15 : 0.10;

    const line = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, TILE_Z - 0.1), mat);
    line.position.set(x, 0.04, 0);
    g.add(line);

    const glow = new THREE.Mesh(new THREE.BoxGeometry(w * 9, 0.02, TILE_Z - 0.1), gMat);
    glow.position.set(x, 0.02, 0);
    g.add(glow);
  });

  // Transverse grid lines every 5 units
  for (let z = -TILE_Z / 2 + 5; z < TILE_Z / 2; z += 5) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W, 0.03, 0.06), MAT.gridLine);
    l.position.set(0, 0.02, z);
    g.add(l);
  }

  // Side barriers
  [-6.15, 6.15].forEach(bx => {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.85, TILE_Z - 0.1), MAT.barrier);
    bar.position.set(bx, 0.41, 0);
    g.add(bar);

    // Barrier top stripe
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, TILE_Z - 0.1), MAT.edgeLine);
    stripe.position.set(bx, 0.85, 0);
    g.add(stripe);
  });

  return g;
}

// Instantiate tiles
const tiles = [];
for (let i = 0; i < N_TILES; i++) {
  const t = buildTile();
  t.position.z = i * TILE_Z - TILE_Z;
  scene.add(t);
  tiles.push(t);
}

// ── Starfield ────────────────────────────────────────────────────
(function buildStars() {
  const pos = new Float32Array(4000 * 3);
  for (let i = 0; i < 4000; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * 500;
    pos[i * 3 + 1] = Math.random() * 80 + 3;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 800;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo,
    new THREE.PointsMaterial({ color: 0xffffff, size: 0.22, transparent: true, opacity: 0.75 })
  ));
})();

// Horizon warm glow plane
const hGeo  = new THREE.PlaneGeometry(300, 50);
const hMat  = new THREE.MeshBasicMaterial({ color: 0x331100, transparent: true, opacity: 0.35, depthWrite: false });
const horizPlane = new THREE.Mesh(hGeo, hMat);
horizPlane.rotation.x = -Math.PI / 2 + 0.05;
horizPlane.position.set(0, 3, 200);
scene.add(horizPlane);

// ── Player Ship ──────────────────────────────────────────────────
function buildShip() {
  const g = new THREE.Group();

  // Main hull
  const hull = new THREE.Mesh(
    new THREE.BoxGeometry(2.8, 0.45, 5.5),
    new THREE.MeshLambertMaterial({ color: 0x0d1a2e })
  );
  g.add(hull);

  // Cockpit raised section
  const cockpit = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.52, 2.2),
    new THREE.MeshLambertMaterial({ color: 0x081222 })
  );
  cockpit.position.set(0, 0.44, -0.6);
  g.add(cockpit);

  // Wings
  const wings = new THREE.Mesh(
    new THREE.BoxGeometry(6.0, 0.12, 2.4),
    new THREE.MeshLambertMaterial({ color: 0x0a1830 })
  );
  wings.position.set(0, 0, 0.6);
  g.add(wings);

  // Neon trim strips (sides)
  [-1.45, 1.45].forEach(x => {
    const trim = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.12, 5.5),
      new THREE.MeshBasicMaterial({ color: 0x00ff88 })
    );
    trim.position.set(x, 0, 0);
    g.add(trim);

    // Trim glow
    const tg = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.06, 5.5),
      new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.15, depthWrite: false })
    );
    tg.position.set(x, 0, 0);
    g.add(tg);
  });

  // Engine exhaust (rear)
  const eng = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 0.28, 0.22),
    new THREE.MeshBasicMaterial({ color: 0x44aaff })
  );
  eng.position.set(0, 0, 2.8);
  g.add(eng);

  // Engine glow
  const eg = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.8, 0.5),
    new THREE.MeshBasicMaterial({ color: 0x0044ff, transparent: true, opacity: 0.18, depthWrite: false })
  );
  eg.position.set(0, 0, 3.0);
  g.add(eg);

  // Under-glow point light
  const uLight = new THREE.PointLight(0x00ff88, 3.5, 7);
  uLight.position.set(0, -0.5, 0);
  g.add(uLight);

  // Engine point light
  const eLight = new THREE.PointLight(0x0066ff, 2.5, 5);
  eLight.position.set(0, 0, 3);
  g.add(eLight);

  return g;
}

const ship = buildShip();
ship.position.set(0, 1.0, -5);
scene.add(ship);

// World-space player glow (follows ship in X each frame)
const worldGlow = new THREE.PointLight(0x00ff88, 2.0, 12);
worldGlow.position.set(0, 1.5, -5);
scene.add(worldGlow);

// ── Obstacle Prefabs ─────────────────────────────────────────────
const OBS_COLORS = [0xff0044, 0xff6600, 0xaa00ff, 0xff3300];

function buildObstacle() {
  const g    = new THREE.Group();
  const col  = OBS_COLORS[Math.floor(Math.random() * OBS_COLORS.length)];
  const type = Math.floor(Math.random() * 3); // 0=block, 1=low bar, 2=gate

  if (type === 0) {
    // Solid block
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(3.0, 1.6, 2.0),
      new THREE.MeshLambertMaterial({ color: 0x110005 })
    );
    g.add(body);

    const front = new THREE.Mesh(
      new THREE.BoxGeometry(3.0, 1.6, 0.12),
      new THREE.MeshBasicMaterial({ color: col })
    );
    front.position.z = -1.06;
    g.add(front);

  } else if (type === 1) {
    // Low ground-bar
    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 0.5, 0.8),
      new THREE.MeshLambertMaterial({ color: 0x110005 })
    );
    g.add(bar);

    const glow = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 0.5, 0.8),
      new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.6 })
    );
    g.add(glow);

  } else {
    // Arched gate (two pillars)
    [-1.2, 1.2].forEach(px => {
      const pillar = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 2.2, 0.4),
        new THREE.MeshLambertMaterial({ color: 0x110005 })
      );
      pillar.position.set(px, 0, 0);
      g.add(pillar);

      const pGlow = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 2.2, 0.5),
        new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.4 })
      );
      pGlow.position.set(px, 0, 0);
      g.add(pGlow);
    });
  }

  // Outer glow halo
  const halo = new THREE.Mesh(
    new THREE.BoxGeometry(4.2, 3.0, 3.0),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.06, depthWrite: false })
  );
  g.add(halo);

  // Point light
  const pl = new THREE.PointLight(col, 3.5, 9);
  g.add(pl);

  g.userData.col = col;
  return g;
}

// ── Particle Pool ────────────────────────────────────────────────
const particles = [];

function spawnExplosion(x, y, z, color) {
  const count = 24;
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 4, 4),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1.0 })
    );
    mesh.position.set(x, y, z);
    const speed = 0.15 + Math.random() * 0.35;
    const angle = Math.random() * Math.PI * 2;
    mesh.userData.vx = Math.cos(angle) * speed;
    mesh.userData.vy = 0.2 + Math.random() * 0.4;
    mesh.userData.vz = (Math.random() - 0.5) * speed;
    mesh.userData.life = 1.0;
    scene.add(mesh);
    particles.push(mesh);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.position.x += p.userData.vx * dt;
    p.position.y += p.userData.vy * dt;
    p.position.z += p.userData.vz * dt;
    p.userData.vy -= 0.018 * dt;
    p.userData.life -= 0.04 * dt;
    p.material.opacity = Math.max(0, p.userData.life);
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

// ── Input ────────────────────────────────────────────────────────
const KEYS = {};
document.addEventListener('keydown', e => { KEYS[e.code] = true;  onKey(e.code, 'down'); });
document.addEventListener('keyup',   e => { KEYS[e.code] = false; });

function onKey(code, dir) {
  if (dir !== 'down') return;
  if (gameState === 'playing') {
    if ((code === 'ArrowLeft'  || code === 'KeyA') && lane > 0)           { lane--; targetX = LANES[lane]; }
    if ((code === 'ArrowRight' || code === 'KeyD') && lane < 2)           { lane++; targetX = LANES[lane]; }
  }
  if ((code === 'Space' || code === 'Enter') && gameState !== 'playing')  { startGame(); }
}

// Touch / swipe
let touchX0 = 0;
document.addEventListener('touchstart', e => { touchX0 = e.touches[0].clientX; });
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - touchX0;
  if (gameState === 'playing') {
    if (dx < -30 && lane > 0) { lane--; targetX = LANES[lane]; }
    if (dx >  30 && lane < 2) { lane++; targetX = LANES[lane]; }
  } else {
    startGame();
  }
});

// ── Game State ───────────────────────────────────────────────────
let gameState  = 'title';
let score      = 0;
let baseSpeed  = 0.28;
let speed      = baseSpeed;
let lives      = 3;
let lane       = 1;
let targetX    = LANES[1];
let shipX      = LANES[1];
let dist       = 0;
let frame      = 0;
let boost      = 100;       // 0–100
let invTimer   = 0;
let obsPool    = [];
let nextObsIn  = 50;        // frames until next obstacle
let obsSpacing = 42;

function startGame() {
  gameState  = 'playing';
  score      = 0;
  dist       = 0;
  frame      = 0;
  lives      = 3;
  lane       = 1;
  targetX    = LANES[1];
  shipX      = LANES[1];
  baseSpeed  = 0.28;
  speed      = baseSpeed;
  boost      = 100;
  invTimer   = 0;
  nextObsIn  = 50;
  obsSpacing = 42;

  obsPool.forEach(o => scene.remove(o));
  obsPool = [];

  document.getElementById('overlay').style.display = 'none';
  refreshHUD();
}

function triggerGameOver() {
  gameState = 'gameover';
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  document.getElementById('overlay-title').textContent  = 'GAME OVER';
  document.getElementById('overlay-sub').textContent    = `Distance: ${Math.floor(dist)} km`;
  document.getElementById('overlay-action').textContent = 'PRESS SPACE OR TAP TO RESTART';
}

// ── HUD Refresh ──────────────────────────────────────────────────
function refreshHUD() {
  document.getElementById('hud-score').textContent  = score.toLocaleString();
  document.getElementById('hud-speed').textContent  = Math.floor(speed * 340) + ' km/h';
  document.getElementById('hud-lives').textContent  = '♦'.repeat(lives) + '◇'.repeat(3 - lives);
  const pct = ((speed - 0.28) / (1.8 - 0.28)) * 100;
  document.getElementById('vel-bar-fill').style.width = Math.min(100, Math.max(0, pct)) + '%';
  const bpct = boost;
  document.getElementById('boost-ring-fill').style.background =
    `conic-gradient(#00aaff ${bpct * 3.6}deg, rgba(0,0,0,0) 0deg)`;
}

// Damage flash element
const dmgFlash = document.getElementById('dmg-flash');
function flashDamage() {
  dmgFlash.style.opacity = 1;
  setTimeout(() => { dmgFlash.style.opacity = 0; }, 120);
}

// ── Collision ────────────────────────────────────────────────────
function checkCollisions() {
  if (invTimer > 0) return;
  for (let i = obsPool.length - 1; i >= 0; i--) {
    const o = obsPool[i];
    const dx = Math.abs(o.position.x - ship.position.x);
    const dz = Math.abs(o.position.z - ship.position.z);
    if (dx < 2.4 && dz < 3.2) {
      lives--;
      spawnExplosion(ship.position.x, ship.position.y, ship.position.z, o.userData.col || 0xff4400);
      flashDamage();
      scene.remove(o);
      obsPool.splice(i, 1);
      invTimer = 130;
      refreshHUD();
      if (lives <= 0) triggerGameOver();
      return;
    }
  }
}

// ── Animation Loop ───────────────────────────────────────────────
let lastT = 0;

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min((t - lastT) / 16.667, 3.0);
  lastT = t;

  if (gameState !== 'playing') {
    renderer.render(scene, camera);
    return;
  }

  frame++;
  dist  += speed * dt * 0.012;
  score  = Math.floor(dist * 110);

  // Speed ramp
  baseSpeed = Math.min(0.28 + dist * 0.0022, 1.8);

  // Boost mechanic
  const boosting = (KEYS['ShiftLeft'] || KEYS['ShiftRight']) && boost > 0;
  if (boosting) {
    boost = Math.max(0, boost - 1.4 * dt);
    speed = Math.min(baseSpeed * 2.0, 3.0);
  } else {
    boost = Math.min(100, boost + 0.35 * dt);
    speed = baseSpeed + (speed - baseSpeed) * Math.pow(0.88, dt); // bleed off boost smoothly
  }

  // ── Scroll road tiles ───────────────────────────────────────
  tiles.forEach(tile => {
    tile.position.z -= speed * dt;
    if (tile.position.z < -TILE_Z * 1.5) {
      tile.position.z += N_TILES * TILE_Z;
    }
  });

  // ── Spawn obstacles ─────────────────────────────────────────
  nextObsIn -= speed * dt;
  if (nextObsIn <= 0) {
    const o = buildObstacle();
    o.position.set(LANES[Math.floor(Math.random() * 3)], 0.85, 70);
    scene.add(o);
    obsPool.push(o);
    obsSpacing = Math.max(14, 42 - dist * 0.3);
    nextObsIn  = obsSpacing;
  }

  // ── Move + cull obstacles ───────────────────────────────────
  for (let i = obsPool.length - 1; i >= 0; i--) {
    const o = obsPool[i];
    o.position.z -= speed * dt;
    // Subtle hover bob
    o.position.y = 0.85 + Math.sin(frame * 0.07 + i * 1.3) * 0.06;
    if (o.position.z < -22) {
      scene.remove(o);
      obsPool.splice(i, 1);
    }
  }

  // ── Collision check ─────────────────────────────────────────
  checkCollisions();

  // ── Invincibility flicker ────────────────────────────────────
  if (invTimer > 0) {
    invTimer -= dt;
    ship.visible = (Math.floor(invTimer / 5) % 2 === 0);
    if (invTimer <= 0) ship.visible = true;
  }

  // ── Player X movement ────────────────────────────────────────
  shipX += (targetX - shipX) * 0.14 * dt;
  ship.position.x  = shipX;
  worldGlow.position.x = shipX;

  // Roll into lane change
  const rollErr = targetX - shipX;
  ship.rotation.z = -rollErr * 0.06;

  // Hover bob
  ship.position.y = 1.0 + Math.sin(frame * 0.06) * 0.08;

  // ── Camera follow ────────────────────────────────────────────
  const camTargetX = shipX * 0.38;
  camera.position.x += (camTargetX - camera.position.x) * 0.07 * dt;

  // ── Update particles ─────────────────────────────────────────
  updateParticles(dt);

  // ── HUD (every 4 frames) ─────────────────────────────────────
  if (frame % 4 === 0) refreshHUD();

  renderer.render(scene, camera);
}

// ── Boot ──────────────────────────────────────────────────────────
refreshHUD();
animate(0);
</script>
</body>
